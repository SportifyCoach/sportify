<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <title>SC - Sessions</title>
</head>

<body>
    <div class="main">
        <div class="top-bar">
            <div class="title">
                <img class="logo" src="img/logo.png" alt="logo">
                <h1>Sportify Coach</h1>
            </div>
            <div class="menu">
                <nav>
                    <ul>
                        <li><a href="esportistes.html">Esportistes</a></li>
                        <li><a href="entrenadors.html">Entrenadors</a></li>
                        <li><a href="sessions.html"><strong>Sessions</strong></a></li>
                        <li><a href="disciplines.html">Disciplines</a></li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="container">
            <!-- Fons fosc + Popup -->
            <div id="popupFonsSessio" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupSessio">&times;</span>
                    <h2>Registrar Sessió</h2>
                    <form id="registreSessioForm"> <!-- TODO -->
                        <label for="titol">Títol:</label>
                        <input type="text" id="titol" name="titol" required>

                        <label for="data">Data:</label>
                        <input type="date" id="data" name="data" required>

                        <label for="hora">Hora:</label>
                        <input type="time" id="hora" name="hora" required>

                        <label for="disciplina">Disciplina:</label>
                        <input type="text" id="disciplina" name="disciplina" required>

                        <button type="submit">Enviar</button>
                        <p id="missatge" class="error"></p>
                    </form>
                </div>
            </div>
            <div id="popupInscripcio" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupInscripcio">&times;</span>
                    <h2>Inscriure's a la sessió</h2>
                    <p id="textSessioInscripcio"></p>
                    <input type="text" id="dniInscripcio" placeholder="Introdueix el teu DNI">
                    <button id="confirmarInscripcio">Inscriure's</button>
                    <p id="missatgeInscripcio"></p>
                </div>
            </div>

            <div id="popupInscrits" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupInscrits">&times;</span>
                    <h2>Inscrits a la sessió</h2>
                    <p id="textInscritsSessio"></p>
                    <input type="text" id="dniEntrenadorCheck" placeholder="DNI de l'entrenador">
                    <button id="verificarEntrenador">Mostrar inscrits</button>
                    <ul id="llistaInscrits"></ul>
                    <p id="missatgeInscrits"></p>
                </div>
            </div>

            <!-- Fons fosc + Popup de confirmació d'eliminació -->
            <div id="popupFonsDeleteSessio" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupDeleteSessio">&times;</span>
                    <h2>Confirmar eliminació</h2>
                    <p id="textConfirmacioSessio">Estàs segur que vols eliminar aquesta sessió?</p>
                    <button id="confirmarDeleteSessio" class="btn-danger">Sí, eliminar</button>
                    <button id="cancelarDeleteSessio">Cancel·lar</button>
                </div>
            </div>

            <h2>Sessions</h2>
            <div class="crud">
                <div class="crud-top vertical">
                    <button id="obrirPopupSessio" class="add-btn">Afegir Sessions</button>
                    <input class="search-bar" id="search-bar-dis" type="text"
                        placeholder="Cerca sessions per Disciplina">
                    <input class="search-bar" id="search-bar-esp" type="text"
                        placeholder="Cerca sessions per Esportista">
                    <input class="search-bar" id="search-bar-ent" type="text"
                        placeholder="Cerca sessions per Entrenador">
                </div>
                <div class="crud-content" id="table"></div>
            </div>
        </div>
    </div>

    <script src="js/sessions.js" defer></script>
</body>

</html>
