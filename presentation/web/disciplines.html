<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <title>SC - Disciplines</title>
</head>

<body>
    <div class="main">
        <div class="top-bar">
            <div class="title">
                <img class="logo" src="img/logo.png" alt="logo">
                <h1>Sportify Coach</h1>
            </div>
            <div class="menu">
                <nav>
                    <ul>
                        <li><a href="esportistes.html">Esportistes</a></li>
                        <li><a href="entrenadors.html">Entrenadors</a></li>
                        <li><a href="sessions.html">Sessions</a></li>
                        <li><a href="disciplines.html"><strong>Disciplines</strong></a></li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="container">
            <!-- Fons fosc + Popup -->
            <div id="popupFons" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopup">&times;</span>
                    <h2>Registre de disciplines</h2>
                    <form id="registreForm">
                        <label for="nom">Nome:</label>
                        <input type="text" id="nom" name="nom" required>

                        <label for="espai">Espai:</label>
                        <input type="text" id="espai" name="espai" required>

                        <button type="submit">Enviar</button>
                        <p id="missatge" class="error"></p>
                    </form>
                </div>
            </div>

            <!-- Fons fosc + Popup de confirmació d'eliminació -->
            <div id="popupFonsDelete" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupDelete">&times;</span>
                    <h2>Confirmar eliminació</h2>
                    <p id="textConfirmacio">Estàs segur que vols eliminar aquesta disciplina?</p>
                    <button id="confirmarDelete" class="btn-danger">Sí, eliminar</button>
                    <button id="cancelarDelete">Cancel·lar</button>
                </div>
            </div>

            <h2>Disciplines</h2>
            <div class="crud">
                <div class="crud-top">
                    <button id="obrirPopup">Registrar disciplina</button>
                    <input class="search-bar" id="search-bar" type="text" placeholder="Cerca disciplina per nom...">
                </div>
                <div class="crud-content" id="table"></div>
            </div>
        </div>
    </div>

    <script src="js/disciplines.js" defer></script>

</body>

</html>
