<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="css/styles.css">
    <link rel="icon" href="img/logo.png">
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&display=swap" rel="stylesheet">

    <title>SC - Entrenadors</title>
</head>

<body>
    <div class="main">
        <div class="top-bar">
            <div class="title">
                <img class="logo" src="img/logo.png" alt="logo">
                <h1>Sportify Coach</h1>
            </div>
            <div class="menu">
                <nav>
                    <ul>
                        <li><a href="esportistes.html">Esportistes</a></li>
                        <li><a href="entrenadors.html"><strong>Entrenadors</strong></a></li>
                        <li><a href="sessions.html">Sessions</a></li>
                        <li><a href="disciplines.html">Disciplines</a></li>
                    </ul>
                </nav>
            </div>
        </div>
        <div class="container">
            <!-- Fons fosc + Popup -->
            <div id="popupFons" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopup">&times;</span>
                    <h2>Registre d'Entrenadors</h2>
                    <form id="registreForm">    
                        <label>Nom: </label>
                        <input name="nom" required />
            
                        <label>Cognoms: </label>
                        <input name="cognoms" required />
            
                        <label>DNI: </label>
                            <input name="dni" required />
            
                        <label>Correu electrònic: </label>
                        <input type="email" name="email" required />
            
                        <label>Especialitat: </label>
                        <input name="especialitat" required />
            
                        <label>Experiència (anys): </label>
                        <input type="number" name="experiencia" min="0" required />

                        <button type="submit">Enviar</button>
                        <p id="missatge" class="error"></p>
                    </form>
                </div>
            </div>

            <!-- Fons fosc + Popup de confirmació d'eliminació -->
            <div id="popupFonsDelete" class="popup-fons">
                <div class="popup">
                    <span class="tancar-popup" id="tancarPopupDelete">&times;</span>
                    <h2>Confirmar eliminació</h2>
                    <p id="textConfirmacio">Estàs segur que vols eliminar aquest entrenador?</p>
                    <button id="confirmarDelete" class="btn-danger">Sí, eliminar</button>
                    <button id="cancelarDelete">Cancel·lar</button>
                </div>
            </div>
            <h2>Entrenadors</h2>
            <div class="crud">
                <div class="crud-top">
                    <button id="obrirPopup">Registrar entrenador</button>
                    <input class="search-bar" id="search-bar" type="text" placeholder="Cerca entrenador per dni">
                </div>
                <div class="crud-content" id="table"></div>
            </div>
        </div>


        <script src="js/entrenadors.js"></script>
        </body>
        </html>
    </div>

</body>

</html>
